<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lung Diagnosis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<body class="dark-mode">
    <!-- Loading Screen -->
    <div id="loading">
        <div class="loader"></div>
        <p>Đang tải...</p>
    </div>

    <!-- Analyzing Overlay -->
    <div id="analyzing-overlay" style="display: none;">
        <div class="analyzing-content">
            <p id="analyzing-text">Đang phân tích... <span id="percentage">0%</span></p>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <p class="mt-3">Quá trình phân tích có thể tốn thời gian, vui lòng chờ...</p>
            <button id="cancel-button" class="btn btn-danger mt-3">Hủy</button>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">Lung Diagnosis</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/history">Lịch sử huấn luyện</a>
                    </li>
                    <li class="nav-item">
                        <button id="theme-toggle" class="btn nav-link"><i class="fas fa-moon"></i></button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <h1 class="mb-4">Lung Diagnosis</h1>

        <!-- Upload Form -->
        <form id="upload-form" enctype="multipart/form-data">
            <div class="input-container">
                <div class="upload-box" id="drop-zone">
                    <label class="form-label">
                        <h3>Chọn ảnh X-quang</h3>
                    </label>
                    <input type="file" id="file-upload" name="file" accept="image/*" class="form-control d-none"
                        required>
                    <div id="file-placeholder"><small><i>Kéo thả ảnh hoặc nhấp để chọn file</i></small></div>
                    <img id="preview-image" src="" alt="Ảnh xem trước" style="display: none;">
                    <div id="file-name" class="file-name"></div>
                </div>
                <div class="model-container">
                    <label for="model-select" class="form-label">Chọn mô hình:</label>
                    <select id="model-select" name="model" class="form-select model-select text-center">
                        {% for model_name, info in models.items() %}
                        <option value="{{ model_name }}">{{ model_name }}</option>
                        {% endfor %}
                    </select>

            </div>
            <div class="button-container mt-3">
                <button type="submit" class="btn btn-grad">Phân tích</button>
            </div>
        </form>

        <!-- Result -->
        <div id="result" class="result">
            <h2>Kết quả phân tích</h2>
            <p id="result-text"></p>
            <div id="metrics-table" style="display: none;">
                <h4>Thông số hiệu suất</h4>
                <table class="table table-dark">
                    <thead>
                        <tr>
                            <th>Chỉ số</th>
                            <th>Giá trị</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Accuracy</td>
                            <td id="accuracy">-</td>
                        </tr>
                        <tr>
                            <td>Precision</td>
                            <td id="precision">-</td>
                        </tr>
                        <tr>
                            <td>Recall</td>
                            <td id="recall">-</td>
                        </tr>
                        <tr>
                            <td>F1 Score</td>
                            <td id="f1-score">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Error -->
        <div id="error" style="display: none;" class="result">
            <h2>Lỗi</h2>
            <p id="error-message"></p>
        </div>
    </div>

    <!-- Scroll to Top Button -->
    <button id="scroll-to-top" title="Cuộn lên đầu">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/jquery.magnific-popup.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/magnific-popup.css">

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
        $(document).ready(function () {
            $('.image-popup').magnificPopup({
                type: 'image',
                closeOnContentClick: true,
                closeBtnInside: false,
                fixedContentPos: true,
                mainClass: 'mfp-no-margins mfp-with-zoom',
                gallery: {
                    enabled: true,
                    navigateByImgClick: true,
                    preload: [0, 1]
                },
                image: {
                    verticalFit: true
                },
                zoom: {
                    enabled: true,
                    duration: 300
                }
            });
        });
    </script>
</body>

</html>
